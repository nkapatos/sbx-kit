# Recipe catalog for sbx-kit (see docs/cli-tooling.md).
#
# Each key is a RECIPE id. Prefer stock recipe ids that match the sbx kind
# (shell, cursor) or a sandbox-kit name (pi). Prefix custom-image recipes
# with kit- so they do not collide with stock names.
#
# A recipe is always: sbx kind + kits + optional image pin.
#   mixin kits     stack on a Hub kind (cursor, shell, …)
#   sandbox kits   ARE the kind: sbx_agent must match the kit's name:
#                  sbx run pi --kit …/kits/pi  (not sbx run shell --kit pi)
#   credentials    live on the kit that needs them (many services per kit);
#                  host: sbx secret set <service> for any you use
#
# Catalog defaults.kits (agent-workspace) are always attached, then recipe kits.
#
# Template source (SOURCE column in sbx-kit recipes):
#   - Omit image_name + template_fallback → stock (sbx kind / kit image)
#   - Set image_name / template_fallback → custom (local/… or registry tag)
#
# Optional mixins: lsp-mise, apt-extras.
# Product scope: docs/product-scope.md

defaults:
  resources: remote-llm
  kits:
    - agent-workspace

agents:
  # Stock sbx shell (agent-workspace from defaults).
  shell:
    sbx_agent: shell

  # Stock sbx cursor + portable state (agent-workspace from defaults).
  cursor:
    sbx_agent: cursor

  # Official shell image + Pi sandbox kit (kind is pi, not shell).
  # Provider keys are declared on kits/pi, not a creds mixin.
  pi:
    sbx_agent: pi
    kits:
      - pi

  # Custom lean floor (build/load or registry pin).
  kit-core:
    sbx_agent: shell
    image_name: sbx-kit-core
    template_fallback: local/sbx-kit-core:latest
    kits:
      - mise-workspace

  # Custom Cursor layer on kit-core.
  kit-cursor:
    sbx_agent: cursor
    image_name: sbx-kit-cursor
    template_fallback: local/sbx-kit-cursor:latest
    kits:
      - mise-workspace

  # Same Pi sandbox kit on kit-core. Install uses mise node@22 + pnpm (no image npm).
  kit-pi:
    sbx_agent: pi
    image_name: sbx-kit-core
    template_fallback: local/sbx-kit-core:latest
    kits:
      - pi
      - mise-workspace
