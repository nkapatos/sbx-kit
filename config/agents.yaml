# Recipe catalog for sbx-kit (see docs/cli-tooling.md).
#
# Each key is a RECIPE id (user-chosen). sbx_agent is the underlying sbx agent.
# This file ships example recipes for this toolkit tree — bring your own catalog
# when pointing SBX_TREE at another templates/kits repo.
#
# Optional capability mixins (not in defaults): lsp-mise, apt-extras.
# Product scope: docs/product-scope.md

defaults:
  resources: remote-llm
  kits:
    - mise-workspace
    - agent-workspace

agents:
  # Lean floor: debian + sbx glue + mise (no project language toolchains).
  kit-core:
    sbx_agent: shell
    image_name: sbx-kit-core
    template_fallback: local/sbx-kit-core:latest
    kits:
      - mise-workspace
      - agent-workspace
  # Cursor agent layered on kit-core.
  cursor:
    sbx_agent: cursor
    image_name: sbx-kit-cursor
    template_fallback: local/sbx-kit-cursor:latest
    kits:
      - mise-workspace
      - agent-workspace
  # Same image as cursor (early testing name).
  kit-cursor:
    sbx_agent: cursor
    image_name: sbx-kit-cursor
    template_fallback: local/sbx-kit-cursor:latest
    kits:
      - mise-workspace
      - agent-workspace
  # Next: kit-pi image layer on kit-core (not create-time install).
