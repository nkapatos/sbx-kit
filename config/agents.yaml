# Recipe catalog. Live view: sbx-kit recipes
#
# Stock ids match the sbx kind or sandbox-kit name. Custom-image recipes: kit- prefix.
# Recipe = kind + kits + optional image. Sandbox kit name == sbx_agent.
# defaults.kits attach after recipe kits. Credentials live on the kit.
# Omit image_name → stock. Set it → custom pin.

defaults:
  resources: remote-llm
  kits:
    - agent-workspace

agents:
  # Stock sbx shell (agent-workspace from defaults).
  shell:
    sbx_agent: shell

  # Stock sbx cursor + portable state (agent-workspace from defaults).
  cursor:
    sbx_agent: cursor

  # Official shell image + Pi sandbox kit (kind is pi, not shell).
  # Provider keys are declared on kits/pi, not a creds mixin.
  pi:
    sbx_agent: pi
    kits:
      - pi

  # Emulates Hub shell: tinishell on kit-core. Add stuff with kits, not layers.
  # Minimum custom image you import into sbx (kit-core is FROM-only).
  kit-shell:
    sbx_agent: shell
    image_name: sbx-kit-shell
    template_fallback: local/sbx-kit-shell:latest
    kits:
      - mise-workspace

  # Custom Cursor layer on kit-core (not via kit-shell).
  kit-cursor:
    sbx_agent: cursor
    image_name: sbx-kit-cursor
    template_fallback: local/sbx-kit-cursor:latest
    kits:
      - mise-workspace

  # Same Pi sandbox kit on kit-shell (parallel to official shell).
  # Install uses mise node@22 + pnpm (no image npm).
  kit-pi:
    sbx_agent: pi
    image_name: sbx-kit-shell
    template_fallback: local/sbx-kit-shell:latest
    kits:
      - pi
      - mise-workspace
