# Recipe catalog for sbx-kit (see docs/cli-tooling.md).
#
# Each key is a RECIPE id (user-chosen). sbx_agent is the underlying sbx agent.
# This file ships example recipes for this toolkit tree — bring your own catalog
# when pointing SBX_TREE at another templates/kits repo.
#
# Optional capability mixins (not in defaults): lsp-mise, apt-extras.
# Add them to a recipe's kits: list when you want box LSPs or apt extras.
# Product scope: docs/product-scope.md

defaults:
  resources: remote-llm
  kits:
    - mise-workspace
    - agent-workspace

agents:
  cursor:
    sbx_agent: cursor
    image_name: sbx-cursor-mise-docker
    template_fallback: local/sbx-cursor-mise-docker:latest
    kits:
      - mise-workspace
      - agent-workspace
  cursor-ide:
    sbx_agent: cursor
    image_name: sbx-cursor-mise-ide
    template_fallback: local/sbx-cursor-mise-ide:latest
    kits:
      - mise-workspace
      - agent-workspace
    stub: true
  opencode:
    sbx_agent: opencode
    image_name: sbx-opencode-mise-docker
    template_fallback: local/sbx-opencode-mise-docker:latest
    kits:
      - mise-workspace
      - agent-workspace
  pi:
    # Pi mixin on shell-mise: install via mise, startup launches pi.
    sbx_agent: shell
    image_name: sbx-shell-mise-docker
    template_fallback: local/sbx-shell-mise-docker:latest
    kits:
      - mise-workspace
      - agent-workspace
      - pi
