# Recipe catalog for sbx-kit (see docs/cli-tooling.md).
#
# Each key is a RECIPE id. Prefer stock recipe ids that match the sbx agent
# name (shell, cursor, …). Prefix custom-image recipes with kit- (or your own
# namespace) so they do not collide with stock names.
#
# Template source (SOURCE column in sbx-kit recipes):
#   - Omit image_name + template_fallback → stock (sbx agent template)
#   - Set image_name / template_fallback → custom (local/… or registry tag)
#
# Optional mixins (not in defaults): lsp-mise, apt-extras, deepseek-creds.
# Product scope: docs/product-scope.md

defaults:
  resources: remote-llm
  kits:
    - mise-workspace
    - agent-workspace

agents:
  # Stock sbx shell + DeepSeek proxy creds trial (no custom image).
  shell:
    sbx_agent: shell
    kits:
      - agent-workspace
      - deepseek-creds

  # Stock sbx cursor + portable state.
  cursor:
    sbx_agent: cursor
    kits:
      - agent-workspace

  # Custom lean floor (build/load or registry pin).
  kit-core:
    sbx_agent: shell
    image_name: sbx-kit-core
    template_fallback: local/sbx-kit-core:latest
    kits:
      - mise-workspace
      - agent-workspace

  # Custom Cursor layer on kit-core.
  kit-cursor:
    sbx_agent: cursor
    image_name: sbx-kit-cursor
    template_fallback: local/sbx-kit-cursor:latest
    kits:
      - mise-workspace
      - agent-workspace
