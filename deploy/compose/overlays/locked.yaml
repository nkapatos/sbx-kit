# Locked overlay: no package self-provision, read-only rootfs.
# Use with vps.yaml:
#   ... -f overlays/vps.yaml -f overlays/locked.yaml up -d
#
# Build base/pi with ENABLE_SUDO=0 for a matching image (recommended):
#   ENABLE_SUDO=0 ./deploy/scripts/build.sh

services:
  pi:
    read_only: true
    # Replace vps/laptop sudo-oriented caps with an empty set.
    cap_add: []
    # /tmp already tmpfs in base compose; add only extra writable dirs for read-only root.
    tmpfs:
      - /run:size=16m
      - /var/tmp:size=64m
