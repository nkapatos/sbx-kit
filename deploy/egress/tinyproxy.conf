## sbx-kit egress proxy — allowlist only (see policy/pi.network.yaml)
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Info
PidFile "/tmp/tinyproxy.pid"
MaxClients 50

# No upstream auth; this proxy is only reachable on the internal agent network.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 127.0.0.1

Filter "/etc/tinyproxy/filter"
# Match CONNECT destination host (not full URL), so allow-list domains work.
FilterURLs Off
FilterDefaultDeny Yes

ConnectPort 443
ConnectPort 80
