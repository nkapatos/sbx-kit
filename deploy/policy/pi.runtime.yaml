# Declarative runtime intent for Pi containers (24/7 VPS).
# Compose overlays should mirror these; future CLI can flag drift.

version: 0
agent: pi
tier: vps

user:
  uid: 1000
  gid: 1000
  name: agent

security:
  no_new_privileges: true
  privileged: false
  docker_socket: false
  host_network: false
  cap_drop: [ALL]
  # vps tier: enough for passwordless sudo/apt self-provision.
  # locked tier: cap_add: [] and ENABLE_SUDO=0 image build.
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  read_only_rootfs: false

resources:
  memory: 2g
  cpus: 2.0
  pids_limit: 1024
  oom_score_adj: 200

logging:
  driver: json-file
  max_size: 10m
  max_file: "3"

restart: unless-stopped

mounts:
  - source: workspace
    target: /workspace
    mode: rw
  - source: agent-state
    target: /home/agent
    mode: rw
  - source: tmpfs
    target: /tmp
    mode: rw
    tmpfs: true

network:
  mode: bridge-via-proxy   # see overlays/vps.yaml
  published_ports: []

entrypoint: [pi]
init: tini

secrets_env:
  - ANTHROPIC_API_KEY

notes: |
  Secrets never belong in the image. chmod 600 compose/.env on the VPS.
  agent-state volume persists ~/.pi and shell history across recreates;
  do not bind-mount host $HOME.
