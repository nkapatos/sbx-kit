schemaVersion: "1"
kind: mixin
name: agent-workspace
displayName: Agent workplace
description: >
  Sandbox-first agent workplace conventions: portable state layout and
  sbx-kit-state pack/unpack helper. Does not mount host ~/.cursor.
  Project-stamped rules stay in the repo (sbx-kit init); session/docs
  material stays under /home/agent and can be exported to the host XDG
  vault via sbx-kit rm --keep-state.

environment:
  variables:
    SBX_AGENT_WORKSPACE: "1"
    SBX_KIT_STATE_MANIFEST: /home/agent/.local/share/sbx-kit/state.manifest

commands:
  startup:
    - description: Ensure portable dirs and install sbx-kit-state on PATH
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          SHARE=/home/agent/.local/share/sbx-kit
          mkdir -p "$SHARE/portable" "$SHARE/bin"
          if [[ -f "$SHARE/bin/sbx-kit-state" ]]; then
            chmod 755 "$SHARE/bin/sbx-kit-state"
            if [[ ! -x /usr/local/bin/sbx-kit-state ]] || ! cmp -s "$SHARE/bin/sbx-kit-state" /usr/local/bin/sbx-kit-state 2>/dev/null; then
              sudo install -m 755 "$SHARE/bin/sbx-kit-state" /usr/local/bin/sbx-kit-state
            fi
          fi
          if [[ "$(id -u)" -eq 0 ]]; then
            chown -R agent:agent /home/agent/.local 2>/dev/null || true
          else
            sudo chown -R agent:agent /home/agent/.local 2>/dev/null || true
          fi
          touch /etc/sandbox-persistent.sh
          if ! grep -qF '# sbx-agent-workspace-state' /etc/sandbox-persistent.sh; then
            printf '%s\n' \
              '# sbx-agent-workspace-state' \
              'export SBX_KIT_STATE_MANIFEST="${SBX_KIT_STATE_MANIFEST:-/home/agent/.local/share/sbx-kit/state.manifest}"' \
              >> /etc/sandbox-persistent.sh
          fi
          # Live Hub vs custom cheat-sheet. Not exported with --keep-state.
          sudo mkdir -p /etc/sbx-kit
          {
            echo "# sbx-kit floor (this box; regenerated at kit startup)"
            echo
            if [ -f /etc/sbx-kit-agent ]; then
              echo "kind: custom"
              echo "layer: $(tr -d '[:space:]' < /etc/sbx-kit-agent)"
              echo "languages: mise when present; do not apt Go/Node/Rust/Python"
              echo "clis: only this image + kits — do not assume Hub gh/npm/go"
            else
              echo "kind: official"
              echo "languages: use this Hub image's preinstalled toolchains"
              echo "clis: use what the image shipped; do not add a parallel mise stack unless mise: yes"
            fi
            echo
            if [ -x /usr/local/bin/mise ] && [ -d /mise ]; then echo "mise: yes"; else echo "mise: no"; fi
            if command -v gh >/dev/null 2>&1; then echo "gh: yes"; else echo "gh: no"; fi
            if command -v npm >/dev/null 2>&1; then echo "npm: yes"; else echo "npm: no"; fi
            if command -v go >/dev/null 2>&1; then echo "go: yes"; else echo "go: no"; fi
          } | sudo tee /etc/sbx-kit/floor.md >/dev/null
          sudo chmod 644 /etc/sbx-kit/floor.md

agentContext: |
  ## This sandbox's floor

  Follow **`/etc/sbx-kit/floor.md`** (written at create/start from *this* box).
  Official Hub images and sbx-kit custom images do **not** have the same tools.

  - **custom** (`/etc/sbx-kit-agent` exists, or floor.md `kind: custom`): lean
    floor. Languages via **mise** when `mise: yes`. Do not assume Hub CLIs
    (`gh`, global `npm`, Go, …).
  - **official** (no `/etc/sbx-kit-agent`): Docker Hub template. Use the
    image's preinstalled tools. Do not apt/mise a second toolchain unless
    floor.md says `mise: yes`.

  Other kits' agentContext still applies; floor.md wins on what is installed.

  ## Agent workplace state (sbx-kit)

  **Portable docs/refs** (agent-first, not the git tree):
  `/home/agent/.local/share/sbx-kit/portable/`
  Prefer this over gitignored `ref/` / `internal/` folders in the project.
  See `portable/README.md` inside that directory. The dir starts with a
  README only — add `refs/`, `docs/`, or `scratch/` as needed.

  Cursor sessions/config under `/home/agent/.cursor` are included in
  exports; caches and credential-shaped paths are excluded.

  **Do not** dump `.env`, tokens, or `auth.json` into `portable/` or
  `~/.cursor` — `--keep-state` would copy them to the host vault.

  Prefer HTTPS + `sbx secret` / proxy injection for git and cloud APIs.
  Do not run `gh auth login` or overwrite `proxy-managed` sentinels with
  real tokens. If `SSH_AUTH_SOCK` is present, treat it as a host-forwarded
  agent (full key use without printing the key) — prefer not relying on it.

  The human can preserve this across sandbox recreate with:
  - `sbx-kit rm --recipe <recipe> --keep-state` (export to host XDG profiles)
  - `sbx-kit run <recipe> --yes --restore-state` (when the box does not exist)
  - `sbx-kit upgrade --recipe <recipe>`

  Detach the agent session before export so SQLite WAL files can checkpoint.
  In-VM helper: `sbx-kit-state check|pack|unpack` (installed by this kit).
