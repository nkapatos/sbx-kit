schemaVersion: "1"
kind: sandbox
name: hermes
displayName: Hermes
description: >
  Hermes agent on sbx-hermes-mise-docker. The agent binary is baked into the
  image (--skip-browser); this kit wires network and agent context.

sandbox:
  image: "docker.io/local/sbx-hermes-mise-docker:latest"
  aiFilename: AGENTS.md
  entrypoint:
    run: [hermes]

network:
  allowedDomains:
    - hermes-agent.nousresearch.com
    - "**.nousresearch.com"
    - github.com
    - "**.github.com"
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - "**.githubusercontent.com"
    - astral.sh
    - "**.astral.sh"
    - pypi.org
    - files.pythonhosted.org
    - nodejs.org
    - "**.nodejs.org"
    - registry.npmjs.org
    - "**.npmjs.org"
    - openrouter.ai
    - "**.openrouter.ai"
    - api.openai.com
    - api.anthropic.com

agentContext: |
  ## Hermes (sbx-kit example)

  You are Hermes inside a Docker AI Sandbox. The `hermes` binary is preinstalled
  (browser/Playwright skipped at image build). Workspace is the mounted project
  path. `sudo` is passwordless.
  Tooling: prefer **mise** for project language runtimes.
  Portable docs/refs: `/home/agent/.local/share/sbx-kit/portable/`.
  neovim is available for in-box or headless ACP.

  First-run provider/model setup may require the human (`hermes setup` /
  `hermes model`) and sbx secrets for the chosen provider.
