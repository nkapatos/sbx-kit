schemaVersion: "1"
kind: mixin
name: lsp-mise
displayName: LSP / editor helpers (mise)
description: >
  Optional box-level mise tools for LSPs and editor helpers. Does not pin
  project language runtimes (those stay in the project mise.toml). Seeds
  /mise/config.toml via commands.initFiles; agent or human runs mise install once.

environment:
  variables:
    MISE_DATA_DIR: /mise
    MISE_CONFIG_DIR: /mise
    MISE_CACHE_DIR: /mise/cache

commands:
  initFiles:
    - path: /mise/config.toml
      mode: "0644"
      onlyIfMissing: true
      description: Box-level mise LSP/helpers config (commented starters)
      content: |
        # Box-level tools (LSPs / helpers). Project pins stay in the workspace mise.toml.
        # Uncomment what you need, or replace this file via a team kit; then: mise install
        [tools]
        # "npm:typescript-language-server" = "latest"
        # "npm:@astrojs/language-server" = "latest"
        # "go:golang.org/x/tools/gopls" = "latest"
        # "pipx:ruff" = "latest"
        # "pipx:basedpyright" = "latest"
        # "cargo:rust-analyzer" = "latest"
  startup:
    - description: Ensure /mise ownership for global config
      command:
        - bash
        - -lc
        - |
          set -euo pipefail
          mkdir -p /mise
          if [ -f /mise/config.toml ]; then
            chown agent:agent /mise/config.toml 2>/dev/null \
              || sudo chown agent:agent /mise/config.toml 2>/dev/null \
              || true
          fi

agentContext: |
  ## Box LSPs (lsp-mise)

  Global mise config: `/mise/config.toml` (box capabilities, not the project).
  Project language pins remain in the workspace `mise.toml`.
  After editing `/mise/config.toml`: `mise install` then `mise ls`.
  Skip this if `/etc/sbx-kit/floor.md` says `mise: no`.
  Do not apt-install language servers when mise can provide them.
