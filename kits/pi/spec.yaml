schemaVersion: "1"
kind: sandbox
name: pi
displayName: Pi
description: >
  BROKEN / parked. Do not use with sbx-kit run. Create fails (sbx 500).
  Next: plain Docker/Compose for VPS. Spec kept for reference only.

sandbox:
  image: "local/sbx-shell-mise-docker:latest"
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  serviceDomains:
    api.anthropic.com: anthropic
    console.anthropic.com: anthropic
    claude.ai: anthropic
  serviceAuth:
    anthropic:
      headerName: x-api-key
      valueFormat: "%s"
  allowedDomains:
    - registry.npmjs.org
    - "**.npmjs.org"
    - nodejs.org
    - "**.nodejs.org"
    - github.com
    - "**.github.com"
    - objects.githubusercontent.com
    - mise.jdx.dev
    - "**.jdx.dev"
    - api.anthropic.com
    - console.anthropic.com
    - claude.ai

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY

commands:
  install:
    - description: Install Pi (mise node + npm) via kit setup script
      user: "1000"
      command: "bash /home/agent/.local/share/sbx-kit/bin/setup-pi.sh"

agentContext: |
  ## Pi (sbx-kit example) — BROKEN

  This kit path is parked. Prefer a plain Docker/Compose image built from the
  shell-mise bake floor when Pi is needed on a VPS or outside sbx.
