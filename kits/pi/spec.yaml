schemaVersion: "1"
kind: sandbox
name: pi
displayName: Pi
description: >
  Pi coding agent on a shell-class image. Installs @earendil-works/pi-coding-agent
  at create; attach entrypoint is pi. Provider API keys are declared here
  (proxy-managed); set any of them on the host with sbx secret set. Do not bake
  Pi into the image.

sandbox:
  image: docker/sandbox-templates:shell
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - registry.npmjs.org
    - "**.npmjs.org"
    - nodejs.org
    - "**.nodejs.org"
    - mise.jdx.dev
    - "**.jdx.dev"
    - github.com
    - "**.github.com"
    - objects.githubusercontent.com
    - api.anthropic.com
    - api.openai.com
    - api.deepseek.com
    - openrouter.ai
    - api.groq.com
    - api.mistral.ai
    - api.x.ai
    - api.together.xyz
  serviceDomains:
    api.anthropic.com: anthropic
    api.openai.com: openai
    api.deepseek.com: deepseek
    openrouter.ai: openrouter
    api.groq.com: groq
    api.mistral.ai: mistral
    api.x.ai: xai
    api.together.xyz: together
  serviceAuth:
    anthropic:
      headerName: x-api-key
      valueFormat: "%s"
    openai:
      headerName: Authorization
      valueFormat: "Bearer %s"
    deepseek:
      headerName: Authorization
      valueFormat: "Bearer %s"
    openrouter:
      headerName: Authorization
      valueFormat: "Bearer %s"
    groq:
      headerName: Authorization
      valueFormat: "Bearer %s"
    mistral:
      headerName: Authorization
      valueFormat: "Bearer %s"
    xai:
      headerName: Authorization
      valueFormat: "Bearer %s"
    together:
      headerName: Authorization
      valueFormat: "Bearer %s"

credentials:
  sources:
    anthropic:
      env: [ANTHROPIC_API_KEY]
    openai:
      env: [OPENAI_API_KEY]
    deepseek:
      env: [DEEPSEEK_API_KEY]
    openrouter:
      env: [OPENROUTER_API_KEY]
    groq:
      env: [GROQ_API_KEY]
    mistral:
      env: [MISTRAL_API_KEY]
    xai:
      env: [XAI_API_KEY]
    together:
      env: [TOGETHER_API_KEY]

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - DEEPSEEK_API_KEY
    - OPENROUTER_API_KEY
    - GROQ_API_KEY
    - MISTRAL_API_KEY
    - XAI_API_KEY
    - TOGETHER_API_KEY

commands:
  install:
    - description: Install pi (official npm, or mise node+pnpm on the lean floor)
      user: "1000"
      command: |
        set -euo pipefail
        PKG="@earendil-works/pi-coding-agent"
        retry() {
          i=0
          while [ "$i" -lt 5 ]; do
            if "$@"; then
              return 0
            fi
            i=$((i + 1))
            echo "Retrying ($i/5): $*"
          done
          return 1
        }
        link_pi() {
          local src="$1"
          if [ ! -x "$src" ]; then
            echo "pi binary not executable: $src" >&2
            return 1
          fi
          sudo ln -sfn "$src" /usr/local/bin/pi
        }
        install_official_npm() {
          if [ -n "${HTTP_PROXY:-}${HTTPS_PROXY:-}" ]; then
            npm config set proxy "${HTTP_PROXY:-${HTTPS_PROXY}}"
            npm config set https-proxy "${HTTPS_PROXY:-${HTTP_PROXY}}"
          fi
          retry npm install -g --ignore-scripts --maxsockets=1 "$PKG" \
            || retry sudo -E env "PATH=$PATH" npm install -g --ignore-scripts --maxsockets=1 "$PKG"
          command -v pi >/dev/null 2>&1
        }
        install_mise_pnpm() {
          export MISE_DATA_DIR="${MISE_DATA_DIR:-/mise}"
          export MISE_CONFIG_DIR="${MISE_CONFIG_DIR:-/mise}"
          export MISE_CACHE_DIR="${MISE_CACHE_DIR:-/mise/cache}"
          export PATH="/mise/shims:/usr/local/bin:${PATH}"
          /usr/local/bin/mise use -g node@22 pnpm
          hash -r
          command -v node >/dev/null 2>&1
          command -v pnpm >/dev/null 2>&1
          export PNPM_HOME="${PNPM_HOME:-/home/agent/.local/share/pnpm}"
          mkdir -p "$PNPM_HOME"
          pnpm config set global-bin-dir "$PNPM_HOME"
          retry pnpm add -g --ignore-scripts "$PKG"
          gbin="$(pnpm bin -g)"
          if [ -x "$gbin/pi" ]; then
            link_pi "$gbin/pi"
          else
            link_pi "$PNPM_HOME/pi"
          fi
          sudo touch /etc/sandbox-persistent.sh
          if ! sudo grep -qF '# sbx-pi-pnpm' /etc/sandbox-persistent.sh; then
            printf '%s\n' \
              '# sbx-pi-pnpm' \
              'export PNPM_HOME="${PNPM_HOME:-/home/agent/.local/share/pnpm}"' \
              'export PATH="${PNPM_HOME}:${PATH}"' \
              | sudo tee -a /etc/sandbox-persistent.sh >/dev/null
          fi
        }
        if [ -x /usr/local/bin/mise ] && [ -d /mise ]; then
          echo "==> lean floor (kit-core/kit-shell): mise node@22 + pnpm, then pnpm add -g $PKG"
          install_mise_pnpm
        elif command -v npm >/dev/null 2>&1; then
          echo "==> official template: npm install -g $PKG"
          install_official_npm
        else
          echo "pi kit: official images need npm; lean floor needs /usr/local/bin/mise and /mise (mise-workspace)." >&2
          exit 1
        fi
        command -v pi >/dev/null 2>&1


agentContext: |
  ## Pi (sandbox kit)

  You are **Pi**, launched as this sandbox's attach entrypoint — not a mixin
  on `sbx run shell`. Follow `/etc/sbx-kit/floor.md` for Hub vs custom tools.

  Project trust defaults to always (this microVM is the boundary). Override
  with `/trust` or `~/.pi/agent/settings.json`.

  Provider keys stay on the host. This kit declares several common APIs; set
  **any** you use (not all required):

      sbx secret set anthropic
      sbx secret set openai
      sbx secret set deepseek
      # also: openrouter, groq, mistral, xai, together

  Inside the box those env vars are proxy sentinels — do not paste real keys
  or run provider `/login` unless you intend host-side OAuth. Extra providers:
  add domains + credentials.sources to this kit or a personal mixin. Do not
  ship one kit per API key.

  `pi` is installed at create. If it is missing, ask the human to recreate
  the sandbox — do not npm-install on a lean floor (`mise: yes`) or
  mise-install Node on an official Hub image (`mise: no`).
  `pi update --self` if the network policy allows it.
