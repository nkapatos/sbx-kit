schemaVersion: "1"
kind: sandbox
name: pi
displayName: Pi
description: >
  Pi coding agent on sbx-pi-mise-docker. The agent binary is baked into the
  image; this kit only wires credentials, network, and agent context.

sandbox:
  image: "docker.io/local/sbx-pi-mise-docker:latest"
  aiFilename: AGENTS.md
  entrypoint:
    run: [pi]

network:
  serviceDomains:
    api.anthropic.com: anthropic
    console.anthropic.com: anthropic
    claude.ai: anthropic
  serviceAuth:
    anthropic:
      headerName: x-api-key
      valueFormat: "%s"
  allowedDomains:
    - registry.npmjs.org
    - "**.npmjs.org"
    - github.com
    - "**.github.com"
    - objects.githubusercontent.com
    - api.anthropic.com
    - console.anthropic.com
    - claude.ai

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY

agentContext: |
  ## Pi (sbx-kit example)

  You are Pi inside a Docker AI Sandbox. The `pi` binary is preinstalled on the
  image. Workspace is the mounted project path. `sudo` is passwordless.
  Tooling: prefer **mise** for language runtimes (see mise-workspace).
  Portable docs/refs: `/home/agent/.local/share/sbx-kit/portable/`.
  neovim is available for in-box or headless ACP.

  Optional extensions: `pi install npm:…` or `pi install git:…` (into
  `~/.pi/agent`). Do not assume Oh My Pi / `omp` — that is a separate fork.
