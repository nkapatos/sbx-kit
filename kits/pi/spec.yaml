schemaVersion: "1"
kind: mixin
name: pi
displayName: Pi
description: >
  Thin mixin for a future kit-pi image: DeepSeek credentials only.
  Does not install Pi — bake the agent on kit-core (same pattern as kit-cursor).

network:
  allowedDomains:
    - api.deepseek.com
  serviceDomains:
    api.deepseek.com: deepseek
  serviceAuth:
    deepseek:
      headerName: Authorization
      valueFormat: "Bearer %s"

credentials:
  sources:
    deepseek:
      env:
        - DEEPSEEK_API_KEY

environment:
  proxyManaged:
    - DEEPSEEK_API_KEY

agentContext: |
  ## Pi

  The Pi binary belongs in the **kit-pi** image (mise-baked on kit-core), not
  this mixin. This kit only adds DeepSeek proxy credentials.

  Host: `sbx secret set -g openai|google|xai|deepseek`. Shell already declares
  openai/google/xai; do not put real keys in the sandbox env or
  `~/.pi/agent/auth.json` unless the human uses `/login`.
