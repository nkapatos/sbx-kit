schemaVersion: "1"
kind: mixin
name: pi
displayName: Pi
description: >
  Installs Pi coding agent via mise on kit-core (or any mise-prepared shell
  template). Create-time install only. Adds DeepSeek credentials
  (openai/google/xai are already declared by the shell agent).

network:
  allowedDomains:
    - api.deepseek.com
  serviceDomains:
    api.deepseek.com: deepseek
  serviceAuth:
    deepseek:
      headerName: Authorization
      valueFormat: "Bearer %s"

credentials:
  sources:
    deepseek:
      env:
        - DEEPSEEK_API_KEY

environment:
  proxyManaged:
    - DEEPSEEK_API_KEY

commands:
  install:
    - description: Install Pi via mise (node, aube, pnpm, npm:pi)
      user: "1000"
      command: |
        set -euo pipefail
        export MISE_DATA_DIR=/mise MISE_CONFIG_DIR=/mise MISE_CACHE_DIR=/mise/cache
        export PATH="/mise/shims:${PATH:-/usr/local/bin:/usr/bin:/bin}"
        if [[ ! -x /usr/local/bin/mise ]]; then
          echo "ERROR: /usr/local/bin/mise missing — load kit-core first" >&2
          exit 1
        fi
        eval "$(/usr/local/bin/mise activate bash)"
        mise settings add idiomatic_version_file_enable_tools node
        mise use -g node@latest
        mise use -g aube@latest
        mise use -g pnpm@latest
        mise use -g 'npm:@earendil-works/pi-coding-agent'
        command -v pi
        pi --version

agentContext: |
  ## Pi

  Pi is installed with mise (`npm:@earendil-works/pi-coding-agent`). Prefer mise
  for Node and package-manager updates (`mise use -g …`, `mise upgrade`).

  Host secrets: shell already wires openai/google/xai. This kit adds deepseek —
  `sbx secret set -g openai|google|xai|deepseek`. Do not put real keys in the
  sandbox env or in `~/.pi/agent/auth.json` unless the human uses `/login`.
